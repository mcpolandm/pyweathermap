<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Building map…</title>
  <meta http-equiv="refresh" content="4">
  {% include "base.html" %}
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card { text-align: center; }
    .dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #e94560;
      margin-right: 8px;
      animation: pulse 1s infinite;
    }
  </style>
</head>
<body>
  <a href="/" class="home-link">← Home</a>
  <div class="card">
    <p><span class="dot"></span>Building weathermap for {{ name }}…</p>
    <p style="font-size:0.85rem;color:#888;margin-top:8px;">
      Sampling live traffic — this page refreshes automatically.
    </p>
    {% if existing_url %}
    <p style="margin-top:16px;">
      <a href="{{ existing_url }}" class="home-link" style="border:1px solid #e94560;padding:6px 12px;border-radius:4px">
        This map has already been generated here
      </a>
    </p>
    {% endif %}
  </div>
  {% include "toast.html" %}
</body>
</html>
