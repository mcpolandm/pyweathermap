<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Map failed</title>
  {% include "base.html" %}
  <style>
    body { padding: 40px; }
    .error-message { color: #e94560; white-space: pre-wrap; }
    .retry-button {
      background: #e94560;
      color: #eee;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 1em;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <a href="/" class="home-link">← Home</a>
  <h2>Failed to build map for {{ name }}</h2>
  <pre class="error-message">{{ error }}</pre>
  <form action="{{ retry_url }}" method="post">
    <button type="submit" class="retry-button">Retry</button>
  </form>
</body>
</html>
